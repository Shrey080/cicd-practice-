name: My First CI Pipeline

on: push

jobs:
  run-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run the app
        run: bash app.sh

      - name: Build Docker image
        run: docker build -t my-cicd-app .

      - name: Run the container
        run: docker run my-cicd-app
